server:
  port: 8090

spring:
  application:
    name: edge-api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_LAST
      routes:
        - id: payment-service-route
          uri: http://localhost:8080
          predicates:
            - Path=/payments/**, /accounts/**, /ledger/**, /outbox/**, /simulation/**, /webhooks/**, /reconciliation/**
        - id: fraud-service-route
          uri: http://localhost:8000
          predicates:
            - Path=/score/**, /health/**

gateway:
  jwt:
    secret: DistributedPaymentSystemSecretKey2026SecureJwtSigningKey

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      cors:
        allowed-origins: "*"
        allowed-methods: "*"
        allowed-headers: "*"
  endpoint:
    health:
      show-details: always
