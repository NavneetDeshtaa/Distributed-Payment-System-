server:
  port: 8080

spring:
  application:
    name: payment-service-outbox
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: 5
      connection-timeout: ${HIKARI_CONN_TIMEOUT_MS:30000}
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: PaymentHikariCP
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: payment-consumer-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: MANUAL_IMMEDIATE

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6380}
      timeout: 2000ms

# Phase 2 & 3 Kafka, Outbox & Redis configuration
payment:
  kafka:
    topic: payment.created
  outbox:
    polling-rate-ms: 1000
    batch-size: 50
  cache:
    ttl-hours: 24
  rate-limiter:
    limit-per-window: 100
    window-seconds: 60
  simulation:
    # Phase 2 Failure Test 1: Simulating Consumer Crash Before Offset Commit
    simulate-consumer-crash: ${SIMULATE_CONSUMER_CRASH:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
